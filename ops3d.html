<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ops 3D — dev harness</title>
<link rel="icon" href="data:," />
<style>
  html, body { margin: 0; height: 100%; background: #0b0c0c; }
  #ops3d-dev { position: fixed; inset: 0; overflow: hidden; }
  #ops3d-dev canvas { width: 100%; height: 100%; display: block; position: relative; z-index: 1; }
  /* Satellite base layer: MapLibre GL mounts here, BEHIND the twin canvas.
   * Keyless Esri imagery; without network this is a styled dusk fallback. */
  #ops3d-dev .sat-base {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(120% 90% at 50% 110%, rgba(64, 86, 120, 0.35) 0%, rgba(11, 12, 12, 0) 55%),
      radial-gradient(90% 70% at 50% -10%, rgba(146, 106, 66, 0.16) 0%, rgba(11, 12, 12, 0) 60%),
      linear-gradient(180deg, #101418 0%, #0c0e10 55%, #0b0c0c 100%);
  }
  #ops3d-dev .sat-base .maplibregl-canvas { position: absolute; inset: 0; }
  #ops3d-dev .sat-base__tag {
    position: absolute; left: 12px; bottom: 12px;
    font: 10px/1.6 ui-monospace, monospace; letter-spacing: 0.14em;
    color: rgba(207, 212, 214, 0.5); pointer-events: none;
  }
  /* Crossfade control: single flat diagonal-cut bar, no popover, z-index
   * under the HUD (hud sits at 10) so it never covers HUD popovers. */
  #ops3d-dev .sat-xfade {
    position: absolute; right: 12px; bottom: 12px; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    background: rgba(10, 14, 18, 0.88);
    border: 1px solid rgba(207, 212, 214, 0.18);
    clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
    font: 10px/1 ui-monospace, monospace; letter-spacing: 0.12em; color: #cfd4d6;
  }
  #ops3d-dev .sat-xfade__btn {
    background: none; border: 0; padding: 4px 2px; cursor: pointer;
    font: inherit; letter-spacing: inherit; color: rgba(207, 212, 214, 0.65);
  }
  #ops3d-dev .sat-xfade__btn[aria-pressed="true"] { color: #ffd9a0; }
  #ops3d-dev .sat-xfade__slider { width: 110px; accent-color: #e8a33d; }
  #ops3d-dev .sat-xfade__auto { display: flex; align-items: center; gap: 4px; opacity: 0.75; }
</style>
</head>
<body>
<div id="ops3d-dev"></div>
<script type="module" src="./src/ops3d/main.js"></script>
</body>
</html>
