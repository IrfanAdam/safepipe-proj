<p class="ch-kicker">Foundations · Radius</p>
<h2 class="ch-hero">Sharp nowhere, bubbly never.</h2>
<p class="ch-lede">Corners run <code>--sp-radius-none → --sp-radius-full</code>. Cards sit at md, inputs at sm, pills at full.</p>

<div class="rad-row">
  <div class="rad-box" style="border-radius:var(--sp-radius-none)">none</div>
  <div class="rad-box" style="border-radius:var(--sp-radius-sm)">sm</div>
  <div class="rad-box" style="border-radius:var(--sp-radius-md)">md</div>
  <div class="rad-box" style="border-radius:var(--sp-radius-lg)">lg</div>
  <div class="rad-box" style="border-radius:var(--sp-radius-full)">full</div>
</div>

<p class="spec-note">Rule: nested surfaces step down one tier (card md → inner input sm) so corners stay concentric.</p>
