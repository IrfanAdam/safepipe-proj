<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ops 3D — Hotspot launcher map</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
<link rel="stylesheet" href="./design-system/ops-tokens.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--ops-bg); }
  #app { position: fixed; inset: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--ops-bg);
    /* GATE-12-A NATIVE-ZOOM: native zoom owns wheel + pinch — the journey
     * rides on zoom events, never captures gestures. touch-action:none lets
     * MapLibre receive the two-finger pinch natively. */
    touch-action: none; }
  /* GATE-12-A: map-side ring clip — corner brackets mark the hotspot ring.
   * The four marks sit ON the ring bounding-ellipse corners: each glyph
   * centre is anchored at centre±axis (--vx,--vy) ± (--rc-axis,--rc-axis-y)
   * minus half the glyph size, so all four centres are equidistant from the
   * hotspot by construction — the SAME --vx/--vy/--vr/--vr-y the vignette
   * ellipse rides (one law writes both; see the journey driver). Each
   * bracket CENTRE sits ON the ring: the axis offsets --rc-axis = --vr /
   * sqrt(2) and --rc-axis-y = --vr-y / sqrt(2) (1/sqrt(2) is the
   * mathematical constant that puts a point at (a,a) exactly on a circle
   * of radius r), so the ink straddles the edge. --clip drives APPEARANCE
   * only (.on fades the layer in); it no longer positions anything, so the
   * old canvas-percentage law (and its corner/circle gap) is gone.
   * Mark size/line are single-definition tokens (--rc-mark/--rc-line); the
   * centering offset derives from them, never a bare px. Hidden sides keep
   * transparent (not removed) borders so every box stays symmetric and its
   * centre lands exactly on the anchor. #ring-clip is
   * inset:0 over #app — the same box as #map and #map-vignette — so the
   * hotspot px apply 1:1. Pointer-transparent; sits above pins AND the
   * wash (the opaque surround must never erase the marks). */
  #ring-clip { position: absolute; inset: 0; z-index: 4; pointer-events: none;
    opacity: 0; transition: opacity 0.3s ease; --clip: 0;
    --rc-mark: 26px; --rc-line: 2px;
    --rc-half: calc((var(--rc-mark) + var(--rc-line) * 2) / 2);
    --rc-axis: calc(var(--vr) * 0.7071067811865476);
    --rc-axis-y: calc(var(--vr-y, var(--vr)) * 0.7071067811865476); }
  #ring-clip.on { opacity: 1; }
  #ring-clip i { position: absolute; width: var(--rc-mark); height: var(--rc-mark);
    border: var(--rc-line) solid var(--ops-amber); opacity: 0.9;
    box-sizing: content-box; }
  #ring-clip .rc-tl { left: calc(var(--vx, 50%) - var(--rc-axis) - var(--rc-half));
    top: calc(var(--vy, 50%) - var(--rc-axis-y) - var(--rc-half));
    border-right-color: transparent; border-bottom-color: transparent; }
  #ring-clip .rc-tr { left: calc(var(--vx, 50%) + var(--rc-axis) - var(--rc-half));
    top: calc(var(--vy, 50%) - var(--rc-axis-y) - var(--rc-half));
    border-left-color: transparent; border-bottom-color: transparent; }
  #ring-clip .rc-bl { left: calc(var(--vx, 50%) - var(--rc-axis) - var(--rc-half));
    top: calc(var(--vy, 50%) + var(--rc-axis-y) - var(--rc-half));
    border-right-color: transparent; border-top-color: transparent; }
  #ring-clip .rc-br { left: calc(var(--vx, 50%) + var(--rc-axis) - var(--rc-half));
    top: calc(var(--vy, 50%) + var(--rc-axis-y) - var(--rc-half));
    border-left-color: transparent; border-top-color: transparent; }
  @media (prefers-reduced-motion: reduce) {
    #ring-clip { transition: none; }
  }
  /* Handoff-3 Lane 1: no MAP/SAT toggle ribbon — satellite switching is
   * transition-only/automatic (outbound flight + recede). Micro attribution
   * credit (see #map-credit) is the only flat-view chrome besides pins. */
  /* Handoff-3 Lane 1: flat-view FULLSCREEN button — same quiet mono
   * treatment as the twin's CLOSE, bottom-right. Toggles #app. */
  #map-fs {
    position: absolute; right: 12px; bottom: 12px; z-index: 2;
    padding: 8px 18px; cursor: pointer;
    background: var(--ops-map-panel);
    border: 1px solid var(--ops-line);
    clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
    font: 10px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.12em;
    color: var(--ops-map-ink);
  }
  #map-fs:hover { color: var(--ops-amber); }
  .map-pins { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .map-pin {
    position: absolute; transform: translate(-50%, -50%);
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--ops-bg);
    font: 11px/1 ui-monospace, monospace; color: var(--ops-bg);
    pointer-events: auto; cursor: pointer;
  }
  .map-pin--ok { background: var(--ops-map-pin-ok); }
  .map-pin--warn { background: var(--ops-map-pin-warn); }
  .map-pin--crit { background: var(--ops-map-pin-crit); }
  .map-pin[data-sel="true"] { outline: 2px solid var(--ops-amber); }
  /* GATE 3 look pass (Lane Q): single monitoring blip. Quiet 8px health dot
   * + expanding pulse ring + tag chip — reads as monitoring, never a pin
   * blob. Scoped to .map-pin--single only; multi-pin + twin overlay styles
   * above/below are untouched, and hit-testing/click wiring is unchanged. */
  .map-pin--single {
    width: 14px; height: 14px; padding: 0;
    background: transparent; border: 0; border-radius: 50%;
  }
  .map-pin--ok.map-pin--single { color: var(--ops-map-pin-ok); }
  .map-pin--warn.map-pin--single { color: var(--ops-map-pin-warn); }
  .map-pin--crit.map-pin--single { color: var(--ops-map-pin-crit); }
  .map-pin--single .map-pin__dot {
    position: absolute; left: 50%; top: 50%;
    width: 8px; height: 8px; transform: translate(-50%, -50%);
    border-radius: 50%; background: currentColor;
    box-shadow: 0 0 0 1.5px var(--ops-map-halo), 0 0 6px var(--ops-map-shade);
  }
  .map-pin--single::after {
    content: ""; position: absolute; inset: -9px; border-radius: 50%;
    border: 2px solid currentColor; opacity: 0;
    animation: map-blip-ping 2.4s ease-out infinite;
    pointer-events: none;
  }
  @keyframes map-blip-ping {
    0% { transform: scale(0.45); opacity: 0.6; }
    70% { transform: scale(1); opacity: 0.12; }
    100% { transform: scale(1); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .map-pin--single::after { animation: none; opacity: 0.35; transform: scale(1); }
  }
  .map-pin--single .map-pin__tag {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font: 10px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.14em;
    color: var(--ops-map-tag-ink); background: var(--ops-map-tag-bg);
    border: 1px solid var(--ops-map-tag-line); border-radius: 3px;
    padding: 3px 7px; white-space: nowrap;
  }
  .map-pin--single[data-sel="true"] { outline: none; }
  .map-pin--single[data-sel="true"] .map-pin__dot {
    box-shadow: 0 0 0 1.5px var(--ops-map-halo), 0 0 0 3.5px var(--ops-amber);
  }
  /* Task 18+19: full-screen twin overlay (iframe). The map stays mounted
   * underneath, so close (X/Esc/back) returns with hex + selection intact. */
  body.twin-open { overflow: hidden; }
  #twin-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: var(--ops-bg);
  }
  #twin-overlay[hidden] { display: none; }
  #twin-overlay #twin-frame {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: var(--ops-bg);
  }
  .twin-overlay__bar {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    display: flex; align-items: center; gap: 12px;
  }
  .twin-overlay__label {
    font: 10px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.12em;
    color: var(--ops-dim);
  }
  #twin-close {
    padding: 8px 18px; cursor: pointer;
    background: var(--ops-map-panel);
    border: 1px solid var(--ops-line);
    clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
    font: 10px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.12em;
    color: var(--ops-map-ink);
  }
  #twin-close:hover { color: var(--ops-amber); }
  /* Handoff-3 Lane 1: overlay-fullscreen guarantee. Fullscreen is requested
   * on #twin-overlay ITSELF, so the CLOSE bar (a child) stays visible in
   * every state: windowed, map-fullscreen, overlay-fullscreen. */
  #app:fullscreen { background: var(--ops-bg); }
  #twin-overlay:fullscreen { background: var(--ops-bg); }
  #twin-overlay:fullscreen .twin-overlay__bar { display: flex; }
  #twin-overlay::backdrop { background: var(--ops-bg); }
  /* T2 handoff: hotspot-centered elliptical enclosure staging the twin open.
   * Radii ride --vr (horizontal) and --vr-y (vertical, squashed by the tilt
   * projection; falls back to --vr pre-write) so the enclosing coincides
   * with the pitched twin clip at handoff. Token-only where
   * possible (outer wash falls back to --ops-bg); pointer-transparent
   * so blip hit-testing is unchanged. Sits above pins, below twin.
   * --vr / --vr-y are registered properties (typed <length>) so per-step
   * radius writes always resolve to a length — never fall back mid-gesture. NOTE:
   * do NOT put --vr / --vr-y in `transition`: a transition on the property freezes
   * the gradient at its start value instead of gliding (verified headless).
   * The close-in reads as animation because the gesture streams steps.
   * Colorless edge: transparent core dissolves across a feathered band
    * straddling --vr / --vr-y (fade starts inside the ellipse edge, full
    * black lands just outside it), then darkness feathers outward to the
    * solid surround — no cut, no color stroke. Feather fractions of --vr
    * (never literal px): at the seam they read the old 64/28px band
    * (0.74/1.12), and the band breathes with the radius on every viewport. */
  @property --vr { syntax: '<length>'; inherits: true; initial-value: 260px; }
  @property --vr-y { syntax: '<length>'; inherits: true; initial-value: 260px; }
  #map-vignette {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse var(--vr) var(--vr-y, var(--vr)) at var(--vx, 50%) var(--vy, 50%),
      transparent 0,
      transparent calc(var(--vr) * 0.74),
      rgba(0, 0, 0, var(--ops-vignette-alpha)) calc(var(--vr) * 1.12),
      var(--ops-bg) 100%);
    opacity: 0; transition: opacity 0.45s ease; /* GATE-3 REVISION tempo */
  }
  #map-vignette.on { opacity: 1; }
  /* GATE-9-A(1): warm vector return — flat hold veil over the map while the
   * zoom-out tile refill lands (same flat tone, instant on, short fade off).
   * Below vignette/pins so chrome never pops; pointer-transparent. */
  #vector-hold {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: var(--ops-map-hold);
    opacity: 0; transition: opacity 0.3s ease;
  }
  #vector-hold.on { opacity: 1; transition: none; }
  @media (prefers-reduced-motion: reduce) {
    #map-vignette { transition: none; }
  }
  #map-fatal {
    display: none; position: fixed; left: 12px; bottom: 12px; z-index: 99;
    max-width: 80vw; padding: 8px 14px;
    background: var(--ops-map-fatal); color: var(--ops-amber);
    font: 11px/1.6 ui-monospace, monospace; white-space: pre-wrap;
  }
  /* LANE A: naked flat view — minimal micro attribution (terms require a
   * credit; tiny bottom-left text, nothing pill-like, no info button). */
  #map-credit {
    position: absolute; left: 6px; bottom: 4px; z-index: 2;
    font: 8px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 0.02em;
    color: var(--ops-map-credit); background: transparent;
    pointer-events: none; user-select: none; max-width: 60vw;
  }
  #map-credit a { color: inherit; text-decoration: none; }
  /* Scale + zoom-range HUD: persistent bottom-center overlay (same
   * always-there treatment as #map-fs). Mono label row + range bar row:
   * widest-out span | track (needle = you, tick = twin handoff) | deepest span.
   * Pointer-transparent; sits clear of credit (left) + fullscreen (right). */
  #map-zoomrange {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    z-index: 2; pointer-events: none; user-select: none;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 7px 12px;
    background: var(--ops-map-panel);
    border: 1px solid var(--ops-line);
    font: 10px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 0.1em;
    color: var(--ops-map-ink); white-space: nowrap;
  }
  #map-zoomrange-row { display: flex; align-items: center; gap: 8px; }
  #map-zoomrange-left, #map-zoomrange-right { opacity: var(--ops-faint); }
  #map-zoomrange-track {
    position: relative; width: 170px; height: 3px;
    background: var(--ops-map-track);
  }
  #map-zoomrange-needle {
    position: absolute; top: -3px; width: 2px; height: 9px;
    background: var(--ops-map-ink);
  }
  #map-zoomrange-hand {
    position: absolute; top: -2px; width: 2px; height: 7px;
    background: var(--ops-amber); opacity: 0.9;
  }
  /* LANE A: never show the maplibre attrib pill / info button even if a
   * control slips in via a plugin path. */
  .maplibregl-ctrl-attrib, .maplibre-ctrl-attrib,
  .maplibregl-ctrl-attrib-button { display: none !important; }
  /* LANE A recede: twin overlay fades instead of cutting.
   * Handoff-4 seeded reveal: forward crossfade map->twin ~450ms
   * (.prewarm holds opacity 0 while the iframe boots); reverse
   * twin->map-sat ~450ms (.closing, symmetric with the forward reveal).
   * GATE-3 REVISION tempo: fades overlap the recede for one gesture.
   * Handoff-5-close: the recede (sat->flat + zoom-out) starts after the
   * fade — never a cut at any step. */
  #twin-overlay { opacity: 1; transition: opacity 0.45s ease; }
  #twin-overlay[hidden] { display: none; }
  #twin-overlay.prewarm { opacity: 0; pointer-events: none; }
  #twin-overlay.closing { opacity: 0; transition-duration: 0.45s; }
  /* GATE-3 REVISION: the staged dissolve is SCRUBBED, so the browser must
   * not also ease it. A CSS transition eases between committed values; when
   * the scroll law rewrites the inline opacity every tick, each write
   * restarts the transition from the current value, so the rendered opacity
   * lags the law (measured: the target reached 1.0 while the rendered value
   * was still 0.89) and the commit then snaps it up. With the transition
   * suspended while the scrub owns the opacity, the law's value IS the
   * rendered value (0, 0.1, 0.2 ... 1) and the commit hands back to the
   * transition with nothing left to snap. The reverse leg (.closing) keeps
   * its own transition — that one is timed, not scrubbed. */
  #twin-overlay.scrubbing { transition: none; }
  @media (prefers-reduced-motion: reduce) {
    #twin-overlay { transition: none; }
  }
</style>
</head>
<body>
<div id="app"><div id="map"></div><div id="map-vignette"></div></div>
<div id="map-fatal"></div>
<script>
(function () {
  var box = document.getElementById('map-fatal');
  function show(msg) {
    box.style.display = 'block';
    box.textContent += msg + '\n';
  }
  window.addEventListener('error', function (e) {
    show('ERR: ' + (e.message || e.error));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('REJECT: ' + (r && (r.message || r)));
  });
  setTimeout(function () {
    if (!window.__mapProbe || !window.__mapProbe.ready) show('STILL LOADING @ +10s: map mount hung.');
  }, 10000);
})();
</script>
<script type="module" src="./src/map/main.js"></script>
</body>
</html>
