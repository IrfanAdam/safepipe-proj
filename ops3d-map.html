<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ops 3D — Hotspot launcher map</title>
<link rel="icon" href="data:," />
<style>
  html, body { margin: 0; height: 100%; background: var(--ops-bg, #0b0c0c); }
  #app { position: fixed; inset: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--ops-bg, #0b0c0c);
    /* GATE-12-A NATIVE-ZOOM: native zoom owns wheel + pinch — the journey
     * rides on zoom events, never captures gestures. touch-action:none lets
     * MapLibre receive the two-finger pinch natively. */
    touch-action: none; }
  /* GATE-12-A: map-side ring clip — corner brackets converging from the
   * canvas edges (--clip:0) to the hotspot ring edges (--clip:1) with the
   * proximity center blend. Pointer-transparent; sits above pins. */
  #ring-clip { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    opacity: 0; transition: opacity 0.3s ease; --clip: 0; }
  #ring-clip.on { opacity: 1; }
  #ring-clip i { position: absolute; width: 26px; height: 26px;
    border: 2px solid var(--ops-amber, #ffd9a0); opacity: 0.9; }
  #ring-clip .rc-tl { left: calc(14px + var(--clip) * 34%); top: calc(14px + var(--clip) * 30%);
    border-right: 0; border-bottom: 0; }
  #ring-clip .rc-tr { right: calc(14px + var(--clip) * 34%); top: calc(14px + var(--clip) * 30%);
    border-left: 0; border-bottom: 0; }
  #ring-clip .rc-bl { left: calc(14px + var(--clip) * 34%); bottom: calc(14px + var(--clip) * 30%);
    border-right: 0; border-top: 0; }
  #ring-clip .rc-br { right: calc(14px + var(--clip) * 34%); bottom: calc(14px + var(--clip) * 30%);
    border-left: 0; border-top: 0; }
  /* Journey vignette: circular enclosure riding on the hotspot (--vx/--vy),
   * fading in once the brackets converge. Transparent core, dark periphery;
   * pointer-transparent; twin open/close share the same toggle. */
  #map-vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    opacity: 0; transition: opacity 0.5s ease; --vx: 50%; --vy: 50%;
    background: radial-gradient(circle 260px at var(--vx) var(--vy),
      transparent 52%, var(--ops-vig, rgba(4, 6, 8, 0.48)) 100%); }
  #map-vignette.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    #ring-clip { transition: none; }
    #map-vignette { transition: none; }
  }
  /* Handoff-3 Lane 1: no MAP/SAT toggle ribbon — satellite switching is
   * transition-only/automatic (outbound flight + recede). Micro attribution
   * credit (see #map-credit) is the only flat-view chrome besides pins. */
  /* Handoff-3 Lane 1: flat-view FULLSCREEN button — same quiet mono
   * treatment as the twin's CLOSE, bottom-right. Toggles #app. */
  #map-fs {
    position: absolute; right: 12px; bottom: 12px; z-index: 2;
    padding: 8px 18px; cursor: pointer;
    background: var(--ops-panel, rgba(10, 14, 18, 0.88));
    border: 1px solid var(--ops-line, rgba(207, 212, 214, 0.18));
    clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
    font: 10px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.12em;
    color: var(--ops-ink, #cfd4d6);
  }
  #map-fs:hover { color: var(--ops-amber, #ffd9a0); }
  .map-pins { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .map-pin {
    position: absolute; transform: translate(-50%, -50%);
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--ops-bg, #0b0c0c);
    font: 11px/1 ui-monospace, monospace; color: #0b0c0c;
    pointer-events: auto; cursor: pointer;
  }
  .map-pin--ok { background: #3eb46e; }
  .map-pin--warn { background: #e8a33d; }
  .map-pin--crit { background: #e05252; }
  .map-pin[data-sel="true"] { outline: 2px solid var(--ops-amber, #ffd9a0); }
  /* GATE 3 look pass (Lane Q): single monitoring blip. Quiet 8px health dot
   * + expanding pulse ring + tag chip — reads as monitoring, never a pin
   * blob. Scoped to .map-pin--single only; multi-pin + twin overlay styles
   * above/below are untouched, and hit-testing/click wiring is unchanged. */
  .map-pin--single {
    width: 14px; height: 14px; padding: 0;
    background: transparent; border: 0; border-radius: 50%;
  }
  .map-pin--ok.map-pin--single { color: #3eb46e; }
  .map-pin--warn.map-pin--single { color: #e8a33d; }
  .map-pin--crit.map-pin--single { color: #e05252; }
  .map-pin--single .map-pin__dot {
    position: absolute; left: 50%; top: 50%;
    width: 8px; height: 8px; transform: translate(-50%, -50%);
    border-radius: 50%; background: currentColor;
    box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.9), 0 0 6px rgba(0, 0, 0, 0.35);
  }
  .map-pin--single::after {
    content: ""; position: absolute; inset: -9px; border-radius: 50%;
    border: 2px solid currentColor; opacity: 0;
    animation: map-blip-ping 2.4s ease-out infinite;
    pointer-events: none;
  }
  @keyframes map-blip-ping {
    0% { transform: scale(0.45); opacity: 0.6; }
    70% { transform: scale(1); opacity: 0.12; }
    100% { transform: scale(1); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .map-pin--single::after { animation: none; opacity: 0.35; transform: scale(1); }
  }
  .map-pin--single .map-pin__tag {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font: 10px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.14em;
    color: #2d373c; background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(45, 55, 60, 0.25); border-radius: 3px;
    padding: 3px 7px; white-space: nowrap;
  }
  .map-pin--single[data-sel="true"] { outline: none; }
  .map-pin--single[data-sel="true"] .map-pin__dot {
    box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.9), 0 0 0 3.5px var(--ops-amber, #ffd9a0);
  }
  /* Task 18+19: full-screen twin overlay (iframe). The map stays mounted
   * underneath, so close (X/Esc/back) returns with hex + selection intact. */
  body.twin-open { overflow: hidden; }
  #twin-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: var(--ops-bg, #0b0c0c);
  }
  #twin-overlay[hidden] { display: none; }
  #twin-overlay #twin-frame {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: #0b0c0c;
  }
  .twin-overlay__bar {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    display: flex; align-items: center; gap: 12px;
  }
  .twin-overlay__label {
    font: 10px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.12em;
    color: var(--ops-dim, rgba(207, 212, 214, 0.65));
  }
  #twin-close {
    padding: 8px 18px; cursor: pointer;
    background: var(--ops-panel, rgba(10, 14, 18, 0.88));
    border: 1px solid var(--ops-line, rgba(207, 212, 214, 0.18));
    clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
    font: 10px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.12em;
    color: var(--ops-ink, #cfd4d6);
  }
  #twin-close:hover { color: var(--ops-amber, #ffd9a0); }
  /* Handoff-3 Lane 1: overlay-fullscreen guarantee. Fullscreen is requested
   * on #twin-overlay ITSELF, so the CLOSE bar (a child) stays visible in
   * every state: windowed, map-fullscreen, overlay-fullscreen. */
  #app:fullscreen { background: var(--ops-bg, #0b0c0c); }
  #twin-overlay:fullscreen { background: var(--ops-bg, #0b0c0c); }
  #twin-overlay:fullscreen .twin-overlay__bar { display: flex; }
  #twin-overlay::backdrop { background: #0b0c0c; }
  /* T2 handoff: hotspot-centered circular enclosure staging the twin open.
   * Radius rides --vr (projected RING_RADIUS_M at the live zoom, set by the
   * journey driver; 260px fallback) so the enclosing coincides with the
   * twin clip circle (685px across at handoff z=12). Token-only where
   * possible (outer wash falls back to --ops-bg); pointer-transparent
   * so blip hit-testing is unchanged. Sits above pins, below twin. */
  #map-vignette {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(circle var(--vr, 260px) at var(--vx, 50%) var(--vy, 50%),
      transparent 52%, rgba(0, 0, 0, 0.28) 78%, var(--ops-bg, #0b0c0c) 100%);
    opacity: 0; transition: opacity 0.45s ease; /* GATE-3 REVISION tempo */
  }
  #map-vignette.on { opacity: 1; }
  /* GATE-9-A(1): warm vector return — flat hold veil over the map while the
   * zoom-out tile refill lands (same flat tone, instant on, short fade off).
   * Below vignette/pins so chrome never pops; pointer-transparent. */
  #vector-hold {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: #f2f1ec;
    opacity: 0; transition: opacity 0.3s ease;
  }
  #vector-hold.on { opacity: 1; transition: none; }
  @media (prefers-reduced-motion: reduce) {
    #map-vignette { transition: none; }
  }
  #map-fatal {
    display: none; position: fixed; left: 12px; bottom: 12px; z-index: 99;
    max-width: 80vw; padding: 8px 14px;
    background: rgba(80, 10, 10, 0.94); color: #ffd9a0;
    font: 11px/1.6 ui-monospace, monospace; white-space: pre-wrap;
  }
  /* LANE A: naked flat view — minimal micro attribution (terms require a
   * credit; tiny bottom-left text, nothing pill-like, no info button). */
  #map-credit {
    position: absolute; left: 6px; bottom: 4px; z-index: 2;
    font: 8px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 0.02em;
    color: rgba(45, 55, 60, 0.5); background: transparent;
    pointer-events: none; user-select: none; max-width: 60vw;
  }
  #map-credit a { color: inherit; text-decoration: none; }
  /* Scale + zoom-range HUD: persistent bottom-center overlay (same
   * always-there treatment as #map-fs). Mono label row + range bar row:
   * widest-out span | track (needle = you, tick = twin handoff) | deepest span.
   * Pointer-transparent; sits clear of credit (left) + fullscreen (right). */
  #map-zoomrange {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    z-index: 2; pointer-events: none; user-select: none;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 7px 12px;
    background: var(--ops-panel, rgba(10, 14, 18, 0.88));
    border: 1px solid var(--ops-line, rgba(207, 212, 214, 0.18));
    font: 10px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 0.1em;
    color: var(--ops-ink, #cfd4d6); white-space: nowrap;
  }
  #map-zoomrange-row { display: flex; align-items: center; gap: 8px; }
  #map-zoomrange-left, #map-zoomrange-right { opacity: 0.65; }
  #map-zoomrange-track {
    position: relative; width: 170px; height: 3px;
    background: var(--ops-line, rgba(207, 212, 214, 0.28));
  }
  #map-zoomrange-needle {
    position: absolute; top: -3px; width: 2px; height: 9px;
    background: var(--ops-ink, #cfd4d6);
  }
  #map-zoomrange-hand {
    position: absolute; top: -2px; width: 2px; height: 7px;
    background: var(--ops-amber, #ffd9a0); opacity: 0.9;
  }
  /* LANE A: never show the maplibre attrib pill / info button even if a
   * control slips in via a plugin path. */
  .maplibregl-ctrl-attrib, .maplibre-ctrl-attrib,
  .maplibregl-ctrl-attrib-button { display: none !important; }
  /* LANE A recede: twin overlay fades instead of cutting.
   * Handoff-4 seeded reveal: forward crossfade map->twin ~450ms
   * (.prewarm holds opacity 0 while the iframe boots); reverse
   * twin->map-sat ~450ms (.closing, symmetric with the forward reveal).
   * GATE-3 REVISION tempo: fades overlap the recede for one gesture.
   * Handoff-5-close: the recede (sat->flat + zoom-out) starts after the
   * fade — never a cut at any step. */
  #twin-overlay { opacity: 1; transition: opacity 0.45s ease; }
  #twin-overlay[hidden] { display: none; }
  #twin-overlay.prewarm { opacity: 0; pointer-events: none; }
  #twin-overlay.closing { opacity: 0; transition-duration: 0.45s; }
  @media (prefers-reduced-motion: reduce) {
    #twin-overlay { transition: none; }
  }
</style>
</head>
<body>
<div id="app"><div id="map"></div><div id="map-vignette"></div></div>
<div id="map-fatal"></div>
<script>
(function () {
  var box = document.getElementById('map-fatal');
  function show(msg) {
    box.style.display = 'block';
    box.textContent += msg + '\n';
  }
  window.addEventListener('error', function (e) {
    show('ERR: ' + (e.message || e.error));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('REJECT: ' + (r && (r.message || r)));
  });
  setTimeout(function () {
    if (!window.__mapProbe || !window.__mapProbe.ready) show('STILL LOADING @ +10s: map mount hung.');
  }, 10000);
})();
</script>
<script type="module" src="./src/map/main.js"></script>
</body>
</html>
